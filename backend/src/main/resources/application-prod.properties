# Active when SPRING_PROFILES_ACTIVE=prod (set by docker-compose).
# Dials back the debug logging used in dev — TradeSearchService logs full request/
# response bodies at DEBUG, which is too noisy/leaky once the app is exposed.
logging.level.com.poeticketqueue=INFO

# Trust X-Forwarded-* from the cloudflared connector so the app sees the real https
# scheme/host (correct cookie flags and any redirects).
server.forward-headers-strategy=framework
