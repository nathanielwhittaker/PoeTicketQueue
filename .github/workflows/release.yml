name: Release

# Publishes an immutable image to GHCR when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Produces ghcr.io/nathanielwhittaker/poeticketqueue:{0.1.0, 0.1, latest}
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase path; the owner is already lowercase.
          images: ghcr.io/nathanielwhittaker/poeticketqueue
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=true

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
